name: Weekly digest email
# Sunday summary of each user's week — wins AND losses. Opt-in (email_digest).
on:
  schedule:
    - cron: "0 18 * * 0"      # Sundays 18:00 UTC
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
      - name: Run once per slot (GitHub's late cron duplicates skip here)
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
          P2U_GATE_BYPASS: "false"
        run: python3 .github/scripts/p2u_gate.py --at 18:00 --job digest

  digest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Send weekly digests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node weekly-digest.js

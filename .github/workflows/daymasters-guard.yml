name: Day masters guard — rebook if today's favourites codes are missing

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Check today's dayMasters (rollover + codes)
        id: c
        run: python3 engine/daymasters_check.py home-picks.json && echo "ok=1" >> "$GITHUB_OUTPUT" || echo "ok=0" >> "$GITHUB_OUTPUT"
      - name: Hand over to the booking watchdog (it re-books without double booking)
        if: steps.c.outputs.ok == '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # The watchdog checks runs, gates and published codes, backs off and caps retries,
          # and re-runs only the job that books the missing codes (no blind forced daily).
          gh workflow run engine-watchdog.yml --ref main -R "$GITHUB_REPOSITORY" || echo "::warning::could not dispatch the watchdog"

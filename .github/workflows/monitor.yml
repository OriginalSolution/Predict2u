name: Monitor (self-healing)

# Lean outside-in check of predict2u.com, the p2u relay and the site's data feeds
# (.github/monitor/checks.json). Runs on GitHub's runners, so it needs no bot credits.
# One `monitor` issue per failing check, closed by itself when the check passes.
# Safe fixes only: wake/redeploy the relay (if RENDER_DEPLOY_HOOK is set) and, when a
# data feed is stale, dispatch the booking watchdog (it never books twice).
# It never merges PRs, re-enables workflows, touches payments or turns off free mode.
# Payment alerts email only meditusa2023@gmail.com, and only if GMAIL_APP_PASSWORD is set.
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"   # 4 runs a day (UTC = Africa/Accra); the ticker also dispatches these
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/monitor
      - uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - name: Check and fix
        working-directory: .github/monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_STATE: ${{ github.workspace }}/.monitor-state/state.json
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_FROM: meditusa2023@gmail.com
          MAIL_TO: meditusa2023@gmail.com
        run: mkdir -p "$(dirname "$MONITOR_STATE")" && python3 monitor.py
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}

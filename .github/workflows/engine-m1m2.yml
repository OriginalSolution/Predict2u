name: Predict2u engine — M1/M2 and Safest market
run-name: "${{ github.workflow }}${{ inputs.dry_run == true && ' (dry run)' || '' }}"

on:
  schedule:
    # 21:45 UTC = 9:45 PM GMT, before the 22:00 cleanup and the 22:30 High Odds strategies.
    - cron: "45 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip commit"
        type: boolean
        default: false
      force:
        description: "Run even if this slot already ran successfully"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
      - name: Run once per slot (GitHub's late cron duplicates skip here)
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
          P2U_GATE_BYPASS: ${{ github.event_name == 'workflow_dispatch' && (inputs.force == true || inputs.dry_run == true) }}
        run: python3 .github/scripts/p2u_gate.py --at 21:45 --job m1m2

  m1m2:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: predict2u-engine
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install runtime extras
        run: pip install cryptography
      - name: Cache Sportradar / engine stats
        uses: actions/cache@v4
        with:
          path: engine/data/stats-cache
          key: p2u-engine-stats-${{ github.run_id }}
          restore-keys: |
            p2u-engine-stats-
      - name: M1/M2 and Safest market
        env:
          P2U_LOCK_KEY: ${{ secrets.P2U_LOCK_KEY }}
          RESEARCH_DIR: ${{ github.workspace }}/engine/data
          REPO_DIR: ${{ github.workspace }}
          ENGINE_DIR: ${{ github.workspace }}/engine
          P2U_STRICT_GATES: report
        run: |
          set -euo pipefail
          python -m engine.vendor.m1m2
          python -m engine.vendor.safe50
          python engine/vendor/prune_live.py "$REPO_DIR"
          python -m engine.premium --lock "$REPO_DIR"
      - name: Commit published model slips
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        env:
          P2U_LOCK_KEY: ${{ secrets.P2U_LOCK_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${P2U_LOCK_KEY:-}" ] && ! python -m engine.premium --is-free . >/dev/null 2>&1; then
            echo "::warning::P2U_LOCK_KEY is not set; refusing to commit pick files so premium codes stay locked on the live site (paid-codes mode; free mode is p2u-free-mode.js)."
            exit 0
          fi
          git config user.name "predict2u-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- hot-picks.json locked.enc.json engine/data/m1m2_ledger.json || true
          if git diff --cached --quiet; then echo "no model changes"; exit 0; fi
          git commit -m "Engine M1/M2 and Safest market $(date -u +%FT%TZ)"
          .github/scripts/p2u_push.sh main

name: Predict2u engine — High-Scoring O1.5/O2.5
run-name: "${{ github.workflow }}${{ inputs.dry_run == true && ' (dry run)' || '' }}"

on:
  schedule:
    # 21:30 UTC = 9:30 PM GMT, next Accra day; before M1/M2 (21:45) and the 22:00 Hot/Bankers publish.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip commit"
        type: boolean
        default: false
      force:
        description: "Run even if this slot already ran successfully"
        type: boolean
        default: false
      date:
        description: "Fixture date YYYY-MM-DD (default: next Accra day after 18:00 GMT, else today)"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
      - name: Run once per slot (GitHub's late cron duplicates skip here)
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
          P2U_GATE_BYPASS: ${{ github.event_name == 'workflow_dispatch' && (inputs.force == true || inputs.dry_run == true) }}
        run: python3 .github/scripts/p2u_gate.py --at 21:30 --job hs15

  hs15:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: predict2u-engine
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install runtime extras
        run: pip install cryptography
      - name: Cache Sportradar / engine stats
        uses: actions/cache@v4
        with:
          path: engine/data/stats-cache
          key: p2u-engine-stats-${{ github.run_id }}
          restore-keys: |
            p2u-engine-stats-
      - name: High-Scoring O1.5/O2.5
        id: strategy
        env:
          P2U_LOCK_KEY: ${{ secrets.P2U_LOCK_KEY }}
          RESEARCH_DIR: ${{ github.workspace }}/engine/data
          REPO_DIR: ${{ github.workspace }}
          ENGINE_DIR: ${{ github.workspace }}/engine
          P2U_STRICT_GATES: report
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "${{ inputs.date }}" ]; then ARGS+=(--date "${{ inputs.date }}"); fi
          if [ "${{ inputs.force }}" = "true" ] && [ "${{ inputs.dry_run }}" != "true" ]; then ARGS+=(--force); fi
          python engine/vendor/hs_goals.py "${ARGS[@]}"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            python -m engine.premium --lock "$REPO_DIR"
          fi
      - name: Commit booked codes
        # !cancelled(): if the strategy crashes after booking, still save what it booked.
        if: ${{ !cancelled() && steps.strategy.outcome != 'skipped' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        env:
          P2U_LOCK_KEY: ${{ secrets.P2U_LOCK_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${P2U_LOCK_KEY:-}" ] && ! python -m engine.premium --is-free . >/dev/null 2>&1; then
            echo "::warning::P2U_LOCK_KEY is not set; refusing to commit pick files so premium codes stay locked on the live site (paid-codes mode; free mode is p2u-free-mode.js)."
            exit 0
          fi
          git config user.name "predict2u-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- hot-picks.json picks.json locked.enc.json engine/data/strategy-codes/hs15 engine/data/strategy-usage || true
          [ -e engine/data/busy-day ] && git add -- engine/data/busy-day || true
          if git diff --cached --quiet; then echo "no High-Scoring changes"; exit 0; fi
          git commit -m "Engine High-Scoring O1.5/O2.5 $(date -u +%FT%TZ)"
          .github/scripts/p2u_push.sh main

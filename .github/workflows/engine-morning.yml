name: Predict2u engine — SportyBet morning markets
run-name: "${{ github.workflow }}${{ inputs.dry_run == true && ' (dry run)' || '' }}"

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 07:00 AM Africa/Accra
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip live booking and commit"
        type: boolean
        default: false
      force:
        description: "Run even if this slot already ran successfully"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
      - name: Run once per slot (GitHub's late cron duplicates skip here)
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
          P2U_GATE_BYPASS: ${{ github.event_name == 'workflow_dispatch' && (inputs.force == true || inputs.dry_run == true) }}
        run: python3 .github/scripts/p2u_gate.py --at 07:00 --job morning

  morning:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: predict2u-engine
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache Sportradar / engine stats
        uses: actions/cache@v4
        with:
          path: engine/data/stats-cache
          key: p2u-engine-stats-${{ github.run_id }}
          restore-keys: |
            p2u-engine-stats-
      - name: Analyse and book morning markets
        env:
          RESEARCH_DIR: ${{ github.workspace }}/engine/data
          REPO_DIR: ${{ github.workspace }}
          ENGINE_DIR: ${{ github.workspace }}/engine
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m engine.pipeline morning --dry-run
          else
            python -m engine.pipeline morning
          fi
      - name: Commit published morning slips
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          git config user.name "predict2u-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- home-picks.json high_odds.json || true
          [ -e engine/data/sb-morning ] && git add -- engine/data/sb-morning || true
          if git diff --cached --quiet; then echo "no morning changes"; exit 0; fi
          git commit -m "Engine morning markets $(date -u +%FT%TZ)"
          .github/scripts/p2u_push.sh main

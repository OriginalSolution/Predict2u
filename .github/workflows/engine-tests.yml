name: Predict2u engine — unit tests

on:
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-*.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - run: python -m pytest engine/tests -q && python -m engine.check_rules

  <meta name="description" content="Honest settled results for Predict2U booking codes — win rate, streak and ROI at a flat GH₵10 stake."/>
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>

  <style>
    :root{--bg:#08090d;--card:#111a27;--line:#24324a;--tx:#f2f6ff;--mut:#b4c2d6;--acc:#34d399;--gold:#ffd36b;--lose:#fb7185;--win:#34d399}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
    a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
    .wrap{max-width:960px;margin:0 auto;padding:16px 14px 110px}
    .hero{background:radial-gradient(120% 140% at 0% 0%,rgba(34,197,94,.16),transparent 55%),linear-gradient(160deg,#0f1a2a,#0a111c);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin:8px 0 14px}
    .kicker{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.14em;color:var(--acc);background:rgba(34,197,94,.12);padding:5px 10px;border-radius:999px}
    h1{font-size:clamp(1.6rem,6vw,2.3rem);margin:10px 0 8px;letter-spacing:-.02em}
    .lead{color:var(--mut);margin:0 0 8px;max-width:60ch}
    .meta{font-size:.8rem;color:var(--mut)}
    .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
    @media(min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
    .kpi b{display:block;font-size:1.45rem;font-weight:900;letter-spacing:-.02em}
    .kpi span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
    .kpi.win b{color:var(--win)}.kpi.lose b{color:var(--lose)}.kpi.flat b{color:var(--gold)}
    .note{font-size:.82rem;color:var(--mut);background:#0d1522;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 16px}
    h2{font-size:1.05rem;margin:18px 0 8px}
    .tbl{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
    .tbl th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:800}
    .tbl tr:last-child td{border-bottom:0}
    .pill{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
    .pill-won{background:#0f3d2a;color:#7ff0b8}.pill-lost{background:#3a1520;color:#ffb0c0}.pill-pending{background:#1f2a3a;color:#c3d0e2}
    .recent{display:grid;gap:8px;margin:8px 0}
    .rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
    .rc-top{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:center}
    .rc-top b{font-size:.95rem}.rc-meta{font-size:.78rem;color:var(--mut)}
    .rc-bot{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:6px;font-size:.82rem;color:var(--mut)}
    .pos{color:var(--win);font-weight:800}.neg{color:var(--lose);font-weight:800}
    .empty{color:var(--mut);padding:16px 0}
    .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
    .links a{min-height:40px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#16233a;color:var(--tx);font-weight:700;font-size:.85rem}
  </style>
</head>
<body>
  <script src="p2u-rg-v322.js?v=322" data-p2u-rg-v322="true"></script>
<script src="unified-shell-v234.js?v=320b"></script>
  <main class="wrap" id="rec-main">
    <section class="hero">
      <span class="kicker">PREDICT2U</span>
      <h1>Track record</h1>
      <p class="lead">Settled booking codes only — no pending slips, no cherry-picking. Flat GH₵10 stake used for ROI.</p>
      <div class="meta" id="rec-meta">Loading…</div>
      <div class="links">
        <a href="index.html">← Home</a>
        <a href="bankers.html">Bankers</a>
        <a href="news.html">Code results</a>
      </div>
    </section>
    <section class="kpis" id="rec-kpis" aria-live="polite"></section>
    <p class="note" id="rec-note" hidden></p>
    <h2>By slip type</h2>
    <div id="rec-type"></div>
    <h2>By site</h2>
    <div id="rec-site"></div>
    <h2>By market</h2>
    <div id="rec-market"></div>
    <h2>By day</h2>
    <div id="rec-day"></div>
    <h2>Recent settled codes</h2>
    <div class="recent" id="rec-recent"></div>
  </main>
  <script src="mobile-app-nav.js" defer></script>
  <script src="p2u-record-v317.js?v=317" defer></script>
  <script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<script src="p2u-live-track-v336.js?v=336" defer></script>
</body>
</html>
